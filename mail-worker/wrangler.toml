name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "f9605dd3-fe93-4673-8296-b3aa92e9cdf1"

[[kv_namespaces]]
binding = "kv"
id = "c91146703d924355babd69d92e84695f"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail"

[[send_email]]
name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存

[[routes]]
pattern = "mail.refaadstack.com"
custom_domain = true

[[routes]]
pattern = "mail.akadnya.com"
custom_domain = true


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["refaadstack.com", "akadnya.com"]
admin = "admin@refaadstack.com"
jwt_secret = "cm-secret-9f2b8a1e4c7d6f3a"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
